[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upright"
version = "0.1.0"
description = "Offline GERD wearable firmware + Flask PWA for Raspberry Pi Zero 2 W"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Constantinescu" }]
dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "segno>=1.6",  # pure-python QR codes (dashboard access, Network screen)
]

[project.optional-dependencies]
# Pi-only — install with `pip install -e ".[pi]"` on the device
pi = [
    "RPi.GPIO>=0.7",
    "smbus2>=0.4",
    "spidev>=3.6",
    "luma.oled>=3.12",
    "luma.lcd>=2.11",
    "luma.core>=2.4",
    "adafruit-blinka>=8.46",
    "adafruit-circuitpython-rgb-display>=3.12",
    # TFLite runtime for the bundled food classifier. ai-edge-litert is the
    # maintained successor with current aarch64 wheels; tflite-runtime is the
    # legacy fallback for older Pi OS images.
    "ai-edge-litert>=1.0; platform_machine=='aarch64'",
    "tflite-runtime>=2.14; platform_machine=='aarch64'",
    "watchdog>=4.0",
    "gunicorn>=21.2",
]
# Heavy CLIP zero-shot food fallback — desktop/dev only. NOT for the Pi Zero 2 W
# (512 MB RAM): CLIP-ViT-Large will not load there, so the firmware skips it and
# uses the lightweight quantized TFLite model instead. Install with ".[clip]".
clip = [
    "transformers>=4.41",
    "torch>=2.2",
]
# Dev tools — install with `pip install -e ".[dev]"` on Mac
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
upright = "upright.main:main"
upright-web = "upright.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upright = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
