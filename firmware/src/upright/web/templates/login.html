{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Device control login</h2>
  {% if error %}
  <p class="warn">{{ error }}</p>
  {% endif %}
  <form method="post" class="stack-form">
    <label>Username
      <input name="username" autocomplete="username" required />
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">Commands are sent to the Pi over the local inbox queue.</p>
</section>
{% endblock %}
