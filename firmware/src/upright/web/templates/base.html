<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <title>UpRight</title>
</head>
<body>
  <header class="app-header">
    <span class="brand">UpRight</span>
    <span class="status-dot" id="live-dot" title="live"></span>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <nav class="tab-bar">
    <a href="/" class="tab {{ 'active' if active=='dashboard' }}">Home</a>
    <a href="/food-log" class="tab {{ 'active' if active=='food-log' }}">Food</a>
    <a href="/sleep" class="tab {{ 'active' if active=='sleep' }}">Sleep</a>
    <a href="/reports" class="tab {{ 'active' if active=='reports' }}">Reports</a>
    <a href="/settings" class="tab {{ 'active' if active=='settings' }}">Settings</a>
  </nav>

  <script src="/static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
