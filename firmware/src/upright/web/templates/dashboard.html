{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Posture</h2>
  <div class="big" id="posture-pct">—</div>
  <div class="bar"><div class="bar-fill" id="posture-bar" style="width:0%"></div></div>
  <div class="row muted">
    <span>Pitch: <b id="pitch">—</b>°</span>
    <span>State: <b id="state">—</b></span>
  </div>
</section>

<section class="card">
  <h2>Device status</h2>
  <div class="row">
    <div><div class="big" id="meal-timer">—</div><div class="muted">meal timer</div></div>
    <div><div class="big" id="sleep-score">—</div><div class="muted">sleep score</div></div>
    <div><div class="big" id="battery-pct">—</div><div class="muted">battery</div></div>
  </div>
  <div id="pending-med" class="muted" style="margin-top:8px;display:none"></div>
</section>

<section class="card">
  <h2>Last meal</h2>
  <div id="last-meal">No meals logged yet.</div>
</section>

<section class="card actions">
  <button type="button" data-action="log-meal">+ Log meal</button>
  <button type="button" data-action="log-symptom">+ Symptom</button>
  <button type="button" data-action="log-water">+ Water</button>
  <button type="button" data-action="log-food-photo">+ Food photo</button>
</section>

<section class="card">
  <h2>Today's timeline</h2>
  <ul id="timeline" class="timeline"></ul>
</section>
{% endblock %}
